[project]
name = "smart-ai-sys-admin"
version = "0.1.0"
description = "AI assisted terminal admin that maintains SSH/SFTP sessions"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Equipo Shell Sentinel"}
]
dependencies = [
  "textual==8.2.7"
]

[project.optional-dependencies]
dev = [
  "black==26.5.1",
  "ruff==0.15.20",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]
include = "src|tests"
extend-exclude = "\\.(md|json)$"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --cov=smart_ai_sys_admin --cov-report=term-missing"
markers = [
  "integration: pruebas lentas o que requieren servicios externos",
]

[tool.coverage.run]
omit = [
  "plugins/*",
  "*/credenciales.py",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
